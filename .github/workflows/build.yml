# Fork 的独立构建通道：build 分支只发布到当前仓库所有者的 GHCR。
name: 构建自有镜像

on:
  push:
    branches: [build]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: 构建 Go 运行时二进制
        shell: bash
        run: |
          set -euo pipefail
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../bin/kin-worker ./cmd/kin-worker)
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../bin/kin-egress ./cmd/kin-egress)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          short_sha="${GITHUB_SHA::12}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${owner}/vm2api:build"
            echo "ghcr.io/${owner}/vm2api:build-${short_sha}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: 构建并推送控制面镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=build-control-plane
          cache-to: type=gha,mode=max,scope=build-control-plane
